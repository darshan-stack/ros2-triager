[pytest]
# Disable ROS 2 launch testing plugins that conflict with standalone pytest
addopts = -p no:launch_testing -p no:ament_xmllint -p no:ament_flake8 -p no:ament_copyright -p no:ament_pep257
testpaths = test
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Ignore ROS 2 system plugins
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
